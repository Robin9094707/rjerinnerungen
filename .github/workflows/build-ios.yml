name: Build RJ ZeitZentrale IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Validate sources and generate project
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint App/Info.plist WidgetExtension/Info.plist \
            Configuration/RJZeitZentrale-iCloud.entitlements.example
          xcodegen generate --spec project.yml
          xcodebuild -list -project RJZeitZentrale.xcodeproj

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project RJZeitZentrale.xcodeproj \
            -scheme RJZeitZentrale \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=26.5' \
            -derivedDataPath "$PWD/.github-tests" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee RJ-ZeitZentrale-tests.log

      - name: Build unsigned device app
        shell: bash
        run: |
          set -o pipefail
          rm -rf .github-derived
          xcodebuild \
            -project RJZeitZentrale.xcodeproj \
            -scheme RJZeitZentrale \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-ZeitZentrale-build.log

      - name: Create unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name 'RJZeitZentrale.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo "No main .app found."
            exit 1
          fi
          test -f "$APP/Assets.car"
          test -f "$APP/glass_chime.wav"
          test -f "$APP/soft_bell.wav"
          test -f "$APP/digital_pulse.wav"
          test -d "$APP/PlugIns/RJZeitZentraleWidgets.appex"
          test ! -d "$APP/_CodeSignature"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocationAlwaysAndWhenInUseUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationShortcutItems:0:UIApplicationShortcutItemType' "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "2.0"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RJ-ZeitZentrale-unsigned.ipa Payload
          unzip -t RJ-ZeitZentrale-unsigned.ipa
          ls -lh RJ-ZeitZentrale-unsigned.ipa

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-ZeitZentrale-unsigned-IPA
          path: RJ-ZeitZentrale-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-ZeitZentrale-build-log
          path: |
            RJ-ZeitZentrale-tests.log
            RJ-ZeitZentrale-build.log
          if-no-files-found: ignore
          retention-days: 14
