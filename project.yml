name: RJZeitZentrale

options:
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "26.1"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  RJZeitZentrale:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Resources
      - path: Shared
    resources:
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.zeitzentrale
        PRODUCT_NAME: RJ ZeitZentrale
        PRODUCT_MODULE_NAME: RJZeitZentrale
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: RJZeitZentraleWidgets
        embed: true
        codeSign: false

  RJZeitZentraleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.zeitzentrale.widgets
        PRODUCT_NAME: RJZeitZentraleWidgets
        PRODUCT_MODULE_NAME: RJZeitZentraleWidgets
        INFOPLIST_FILE: WidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  RJZeitZentraleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RJZeitZentrale
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.zeitzentrale.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RJZeitZentrale:
    build:
      targets:
        RJZeitZentrale: all
        RJZeitZentraleWidgets: all
        RJZeitZentraleTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RJZeitZentraleTests
    run:
      config: Debug
    archive:
      config: Release
